[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/finn-parity-supervisord.pid

[program:api]
command=/usr/local/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
directory=/app
autorestart=true
startretries=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=TRADAMIND_BUILD_SERVICE="backend",TRADAMIND_CELERY_PROFILE="api"

[program:background]
command=/usr/local/bin/celery -A backend.celery_task.celery_app worker --loglevel=info -Ofair --concurrency=1 --max-tasks-per-child=50 -Q %(ENV_CELERY_QUEUE_PREFIX)scelery,%(ENV_CELERY_QUEUE_PREFIX)smarket_data,%(ENV_CELERY_QUEUE_PREFIX)sportfolio,%(ENV_CELERY_QUEUE_PREFIX)sscoring,%(ENV_CELERY_QUEUE_PREFIX)sexecution_critical,%(ENV_CELERY_QUEUE_PREFIX)sai_generation -n parity-background@%%h
directory=/app
autorestart=true
startretries=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=TRADAMIND_BUILD_SERVICE="celery-worker-default",TRADAMIND_CELERY_PROFILE="full"

[program:finn-interactive]
command=/usr/local/bin/celery -A backend.celery_task.celery_app worker --loglevel=info -Ofair --concurrency=1 --max-tasks-per-child=50 -Q %(ENV_CELERY_QUEUE_PREFIX)sfinn_interactive -n parity-finn-interactive@%%h
directory=/app
autorestart=true
startretries=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=TRADAMIND_BUILD_SERVICE="celery-worker-finn-interactive",TRADAMIND_CELERY_PROFILE="finn"
