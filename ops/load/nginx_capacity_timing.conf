# Include once in nginx's http context for a bounded capacity run.
# Add both the inherited standard access_log and the conditional capacity log
# to the production `/api/` location, then validate with nginx -t and reload.
# The log contains only a matching client-supplied trace and timing metadata.
map $http_x_trace_id $capacity_trace {
    default 0;
    "~^cap-[0-9a-f]{16}$" 1;
}

log_format capacity_timing escape=json
    'end_utc_epoch="$msec" trace="$http_x_trace_id" uri="$uri" '
    'status=$status nginx_pid=$pid request_s=$request_time '
    'upstream_connect_s="$upstream_connect_time" '
    'upstream_header_s="$upstream_header_time" '
    'upstream_response_s="$upstream_response_time" '
    'upstream_addr="$upstream_addr" app="$upstream_http_server_timing"';
