name: finn-parity

x-finn-env: &finn-env
  APP_ENV: local_finn
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: finn_parity
  DB_USER: finn_parity
  DB_PASS: finn_parity_only
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_QUEUE_PREFIX: parity-
  OPENAI_CALLS_ENABLED: "true"
  OPENAI_API_KEY: ${OPENAI_API_KEY:?source ~/tradamind-local-secrets/finn-development.env before parity start}
  JWT_SECRET_KEY: local-finn-parity-not-production-jwt-secret
  SECRET_KEY: local-finn-parity-not-production-app-secret
  FINN_LOCAL_SAFE_ADAPTERS: "1"
  FINN_V2_LIFECYCLE_DEADLINE_SECONDS: "14"
  FINN_V2_SELECTOR_PHASE_DEADLINE_SECONDS: "12"
  FINN_V2_REASONING_TIMEOUT_SECONDS: "12"
  FINN_V2_SEMANTIC_VERIFIER_TIMEOUT_SECONDS: "4"
  FINN_V2_VISIBLE_REQUEST_TIMEOUT_SECONDS: "20"
  FINN_V2_VISIBLE_REQUEST_TIMEOUT_MUTATION_SECONDS: "45"

x-backend: &backend
  # Production runs Linux/AMD64.  The Apple-Silicon Docker default loads an
  # ARM coincurve wheel that crashes during FINN's normal application import,
  # so it cannot serve as a production-parity signal.
  platform: linux/amd64
  build:
    context: .
    dockerfile: ops/local-finn/Dockerfile.finn-parity
  environment: *finn-env
  depends_on:
    migrate:
      condition: service_completed_successfully
  volumes:
    - ./.local-finn-parity-artifacts:/artifacts

services:
  postgres:
    platform: linux/amd64
    image: postgres:16
    environment:
      POSTGRES_DB: finn_parity
      POSTGRES_USER: finn_parity
      POSTGRES_PASSWORD: finn_parity_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn_parity -d finn_parity"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 160m
    volumes: ["finn-parity-postgres:/var/lib/postgresql/data"]

  redis:
    platform: linux/amd64
    image: redis:alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 32m

  migrate:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ops/local-finn/Dockerfile.finn-parity
    environment: *finn-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -ec 'python backend/scripts/bootstrap_local_finn_schema.py &&
      for migration in backend/scripts/migrations/*.py; do python backend/scripts/run_sql_migration.py "$$migration"; done'
    restart: "no"

  runtime:
    <<: *backend
    command: supervisord -c /etc/supervisor/conf.d/finn-parity.conf
    ports: ["127.0.0.1:${FINN_PARITY_BACKEND_PORT:-18001}:8000"]
    # API and both prefork pools share one cgroup, just as they share the
    # production host. This prevents a green matrix from hiding an API OOM
    # behind separate per-container memory allowances.
    mem_limit: 780m
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from urllib.request import urlopen; urlopen(\"http://127.0.0.1:8000/api/health\", timeout=2)'" ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  finn-parity-postgres:
