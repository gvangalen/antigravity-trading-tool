services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finn_local
      POSTGRES_USER: finn_local
      POSTGRES_PASSWORD: finn_local_only
    ports: ["127.0.0.1:${FINN_LOCAL_POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn_local -d finn_local"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["finn-local-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:alpine
    ports: ["127.0.0.1:${FINN_LOCAL_REDIS_PORT:-56379}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  finn-local-postgres:
