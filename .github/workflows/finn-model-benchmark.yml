name: FINN Selector Model Benchmark (Temporary)

on:
  push:
    branches:
      - codex/finn-model-benchmark

jobs:
  selector-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASELINE_SHA: 4b2619eda8ac316650e6731654798e02a352d183
      RAW_SERVER_IP: ${{ secrets.HOST || secrets.SERVER_IP || vars.HOST || vars.SERVER_IP }}
      RAW_DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Prepare ephemeral host access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAW_SERVER_IP:-}"
          test -n "${RAW_DEPLOY_KEY:-}"
          printf '%s\n' "$RAW_DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 600 "$RUNNER_TEMP/deploy-key"

      - name: Run exact-baseline selector datasets serially
        shell: bash
        run: |
          set -euo pipefail
          for MODEL in gpt-4o-mini gpt-5.6-terra gpt-5.6-sol; do
            /usr/bin/ssh -i "$RUNNER_TEMP/deploy-key" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              "ubuntu@$RAW_SERVER_IP" \
              "BASELINE_SHA='$BASELINE_SHA' MODEL='$MODEL' RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          remote_dir=/home/ubuntu/antigravity-trading-tool
          worktree_dir="/tmp/finn-model-canary-${RUN_ID}"
          result_dir="/tmp/finn-model-benchmark-${RUN_ID}"

          cleanup() {
            git -C "$remote_dir" worktree remove --force "$worktree_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          set -o allexport
          source "$HOME/.secrets/trading.env"
          set +o allexport
          git -C "$remote_dir" worktree add --detach "$worktree_dir" "$BASELINE_SHA" >/dev/null
          cd "$worktree_dir/backend/trading-tool-backend"
          mkdir -p "$result_dir"

          for dataset in development regression; do
            OPENAI_MODEL="$MODEL" FINN_V2_REAL_SELECTOR_EVAL=1 PYTHONPATH=. \
              python3 backend/scripts/run_finn_v2_selector_eval.py "$dataset" \
                --min-interval-seconds 2 \
                --output "$result_dir/${MODEL}-${dataset}.json"
          done
          REMOTE
          done

      - name: Collect raw redacted selector projections
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/finn-model-benchmark"
          /usr/bin/scp -i "$RUNNER_TEMP/deploy-key" \
            -o StrictHostKeyChecking=no \
            "ubuntu@$RAW_SERVER_IP:/tmp/finn-model-benchmark-${GITHUB_RUN_ID}/*" \
            "$RUNNER_TEMP/finn-model-benchmark/"

      - name: Upload benchmark projections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finn-selector-model-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/finn-model-benchmark
          if-no-files-found: error
