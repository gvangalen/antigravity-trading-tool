name: FINN Selector Candidate Evaluation (Temporary)

on:
  push:
    branches:
      - codex/finn-model-benchmark

jobs:
  selector-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: 337e936a
      RAW_SERVER_IP: ${{ secrets.HOST || secrets.SERVER_IP || vars.HOST || vars.SERVER_IP }}
      RAW_DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Package candidate commit for the disposable server worktree
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/finn-selector-candidate.bundle" HEAD~1..HEAD

      - name: Prepare ephemeral host access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAW_SERVER_IP:-}"
          test -n "${RAW_DEPLOY_KEY:-}"
          printf '%s\n' "$RAW_DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 600 "$RUNNER_TEMP/deploy-key"

      - name: Transfer immutable candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/scp -i "$RUNNER_TEMP/deploy-key" \
            -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/finn-selector-candidate.bundle" \
            "ubuntu@$RAW_SERVER_IP:/tmp/finn-selector-candidate-${GITHUB_RUN_ID}.bundle"

      - name: Run candidate development and regression selector datasets serially
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ssh -i "$RUNNER_TEMP/deploy-key" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "ubuntu@$RAW_SERVER_IP" \
            "CANDIDATE_SHA='$CANDIDATE_SHA' RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          remote_dir=/home/ubuntu/antigravity-trading-tool
          worktree_dir="/tmp/finn-selector-candidate-${RUN_ID}"
          result_dir="/tmp/finn-selector-candidate-results-${RUN_ID}"

          cleanup() {
            git -C "$remote_dir" worktree remove --force "$worktree_dir" >/dev/null 2>&1 || true
            git -C "$remote_dir" update-ref -d "refs/finn-selector-candidate/${RUN_ID}" >/dev/null 2>&1 || true
            rm -f "/tmp/finn-selector-candidate-${RUN_ID}.bundle"
          }
          trap cleanup EXIT

          set -o allexport
          source "$HOME/.secrets/trading.env"
          set +o allexport
          candidate_ref="refs/finn-selector-candidate/${RUN_ID}"
          git -C "$remote_dir" fetch "/tmp/finn-selector-candidate-${RUN_ID}.bundle" "HEAD:${candidate_ref}" >/dev/null
          test "$(git -C "$remote_dir" rev-parse "$candidate_ref")" = "$CANDIDATE_SHA"
          git -C "$remote_dir" worktree add --detach "$worktree_dir" "$candidate_ref" >/dev/null
          cd "$worktree_dir/backend/trading-tool-backend"
          mkdir -p "$result_dir"

          for dataset in development regression; do
            OPENAI_MODEL="gpt-4o-mini" FINN_V2_REAL_SELECTOR_EVAL=1 PYTHONPATH=. \
              python3 backend/scripts/run_finn_v2_selector_eval.py "$dataset" \
                --min-interval-seconds 2 \
                --output "$result_dir/gpt-4o-mini-${dataset}.json"
          done
          REMOTE

      - name: Collect raw redacted selector projections
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/finn-selector-candidate"
          /usr/bin/scp -i "$RUNNER_TEMP/deploy-key" \
            -o StrictHostKeyChecking=no \
            "ubuntu@$RAW_SERVER_IP:/tmp/finn-selector-candidate-results-${GITHUB_RUN_ID}/*" \
            "$RUNNER_TEMP/finn-selector-candidate/"

      - name: Upload benchmark projections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finn-selector-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/finn-selector-candidate
          if-no-files-found: error
