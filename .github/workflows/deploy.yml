name: Auto Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: auto-deploy-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve deploy inputs
        id: deploy-inputs
        shell: bash
        env:
          RAW_SERVER_IP: ${{ secrets.HOST || secrets.SERVER_IP || vars.HOST || vars.SERVER_IP }}
          RAW_DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${RAW_SERVER_IP:-}" ]; then
            echo "❌ Missing deploy host. Configure Actions secret HOST (preferred) or SERVER_IP." >&2
            exit 1
          fi

          if [ -z "${RAW_DEPLOY_KEY:-}" ]; then
            echo "❌ Missing deploy SSH key. Configure Actions secret SSH_PRIVATE_KEY (preferred) or DEPLOY_SSH_KEY." >&2
            exit 1
          fi

          printf 'server_ip=%s\n' "$RAW_SERVER_IP" >> "$GITHUB_OUTPUT"
          {
            echo 'deploy_key<<EOF'
            printf '%s\n' "$RAW_DEPLOY_KEY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout deploy commit
        uses: actions/checkout@v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prepare deploy key
        shell: bash
        env:
          DEPLOY_KEY: ${{ steps.deploy-inputs.outputs.deploy_key }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tradamind-deploy-key"
          chmod 600 "$RUNNER_TEMP/tradamind-deploy-key"

      - name: Verify tracked frontend export
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "ℹ️ No parent commit available for deploy diff; skipping frontend export freshness check."
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          frontend_source_changed="$(
            printf '%s\n' "$changed_files" |
            grep '^frontend/trading-tool-frontend/' |
            grep -v '^frontend/trading-tool-frontend/out/' |
            grep -Ev '\.bak$' || true
          )"
          frontend_export_changed="$(printf '%s\n' "$changed_files" | grep '^frontend/trading-tool-frontend/out/' || true)"

          if [ -n "$frontend_source_changed" ] && [ -z "$frontend_export_changed" ]; then
            echo "Frontend source changed, but the tracked frontend export was not updated:" >&2
            printf '%s\n' "$frontend_source_changed" >&2
            echo "Run npm run build in frontend/trading-tool-frontend and commit out/ before deploying." >&2
            exit 1
          fi

      - name: Deploy production
        shell: bash
        env:
          SERVER_IP: ${{ steps.deploy-inputs.outputs.server_ip }}
          SSH_KEY: ${{ runner.temp }}/tradamind-deploy-key
          SKIP_GIT_PUSH: "true"
        run: |
          set -euo pipefail
          ./ops/deploy/deploy_env.sh production main "GitHub Actions production deploy"
