name: Auto Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: auto-deploy-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prepare deploy key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tradamind-deploy-key"
          chmod 600 "$RUNNER_TEMP/tradamind-deploy-key"

      - name: Verify tracked frontend export
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "ℹ️ No parent commit available for deploy diff; skipping frontend export freshness check."
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          frontend_source_changed="$(printf '%s\n' "$changed_files" | grep '^frontend/trading-tool-frontend/' | grep -v '^frontend/trading-tool-frontend/out/' || true)"
          frontend_export_changed="$(printf '%s\n' "$changed_files" | grep '^frontend/trading-tool-frontend/out/' || true)"

          if [ -n "$frontend_source_changed" ] && [ -z "$frontend_export_changed" ]; then
            echo "Frontend source changed, but the tracked frontend export was not updated:" >&2
            printf '%s\n' "$frontend_source_changed" >&2
            echo "Run npm run build in frontend/trading-tool-frontend and commit out/ before deploying." >&2
            exit 1
          fi

      - name: Deploy production
        shell: bash
        env:
          SERVER_IP: ${{ secrets.HOST }}
          SSH_KEY: ${{ runner.temp }}/tradamind-deploy-key
          SKIP_GIT_PUSH: "true"
        run: |
          set -euo pipefail
          ./ops/deploy/deploy_env.sh production main "GitHub Actions production deploy"
