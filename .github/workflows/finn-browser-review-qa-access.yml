name: FINN Browser Trade Review QA Access

# Temporary access for an authenticated browser QA account. The product gate
# stays on its explicit allowlist; this workflow never enables all users.
"on":
  workflow_dispatch:
    inputs:
      account_id:
        description: Numeric ID of the browser QA account
        required: true
        type: string
      action:
        description: Add or remove this QA account from the review allowlist
        required: true
        type: choice
        options:
          - add
          - remove

permissions:
  contents: read

concurrency:
  group: finn-browser-review-qa-access
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'gvangalen/antigravity-trading-tool'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      QA_HOST: ${{ secrets.QA_SSH_HOST || secrets.HOST || secrets.SERVER_IP }}
      QA_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      QA_KNOWN_HOSTS: ${{ secrets.QA_SSH_KNOWN_HOSTS }}
      ACCOUNT_ID: ${{ inputs.account_id }}
      QA_ACTION: ${{ inputs.action }}
    steps:
      - name: Validate and prepare protected connection
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ "$ACCOUNT_ID" =~ ^[1-9][0-9]{0,9}$ ]]
          (( ACCOUNT_ID <= 2147483647 ))
          [[ "$QA_ACTION" = add || "$QA_ACTION" = remove ]]
          test -n "$QA_HOST" && test -n "$QA_KEY" && test -n "$QA_KNOWN_HOSTS"
          printf '%s\n' "$QA_KEY" > "$RUNNER_TEMP/qa-key"
          printf '%s\n' "$QA_KNOWN_HOSTS" > "$RUNNER_TEMP/qa-known-hosts"
          chmod 600 "$RUNNER_TEMP/qa-key" "$RUNNER_TEMP/qa-known-hosts"

      - name: Change only the protected review allowlist
        shell: bash
        run: |
          set -euo pipefail
          set +x
          ssh -i "$RUNNER_TEMP/qa-key" \
            -o "UserKnownHostsFile=$RUNNER_TEMP/qa-known-hosts" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "ubuntu@$QA_HOST" "bash -s -- '$ACCOUNT_ID' '$QA_ACTION'" <<'REMOTE'
          set -euo pipefail
          set +x
          python3 - "$1" "$2" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          import tempfile

          target_id, action = sys.argv[1:]
          if not re.fullmatch(r'[1-9][0-9]{0,9}', target_id) or int(target_id) > 2147483647:
              raise SystemExit('invalid_account_id')
          if action not in {'add', 'remove'}:
              raise SystemExit('invalid_action')
          path = Path.home() / '.secrets/trading.env'
          lines = path.read_text().splitlines(keepends=True)
          def assignment(key):
              matches = [i for i, line in enumerate(lines) if re.match(r'^\s*(?:export\s+)?' + key + r'\s*=', line)]
              if len(matches) != 1:
                  raise SystemExit('ambiguous_review_configuration')
              index = matches[0]
              value = lines[index].split('=', 1)[1].strip().strip('"\'')
              return index, value

          _, mode = assignment('FINN_TRADE_REVIEW_ROLLOUT')
          if mode != 'allowlist':
              raise SystemExit('review_rollout_is_not_allowlist')
          index, raw = assignment('FINN_TRADE_REVIEW_USER_IDS')
          ids = [part.strip() for part in raw.split(',') if part.strip()]
          if len(ids) > 100 or any(not re.fullmatch(r'[1-9][0-9]{0,9}', part) or int(part) > 2147483647 for part in ids):
              raise SystemExit('invalid_existing_allowlist')
          if action == 'add' and target_id not in ids:
              ids.append(target_id)
          if action == 'remove':
              ids = [part for part in ids if part != target_id]
          if not ids or len(ids) > 100:
              raise SystemExit('invalid_updated_allowlist')
          lines[index] = 'FINN_TRADE_REVIEW_USER_IDS=' + ','.join(ids) + '\n'
          fd, temporary = tempfile.mkstemp(prefix='trading.env.', dir=path.parent)
          try:
              with os.fdopen(fd, 'w') as handle:
                  handle.writelines(lines)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.chmod(temporary, path.stat().st_mode & 0o777)
              os.replace(temporary, path)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          print('review_allowlist_updated=PASS')
          PY
          cd /home/ubuntu/antigravity-trading-tool
          set -a
          source "$HOME/.secrets/trading.env"
          set +a
          if [ -s "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; fi
          pm2 startOrReload ecosystem.production.config.js --update-env >/dev/null
          pm2 save --force >/dev/null
          curl -fsS --retry 20 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8000/api/health >/dev/null
          printf '%s\n' 'api_health=PASS'
          REMOTE
