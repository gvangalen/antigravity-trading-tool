name: FINN QA Fixture Operations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose or provision the designated protected QA fixture
        required: true
        type: choice
        options:
          - diagnose
          - diagnose-manifest
          - provision

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'gvangalen/antigravity-trading-tool'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare protected connection
        shell: bash
        env:
          QA_MODE: ${{ inputs.mode }}
          QA_HOST: ${{ secrets.QA_SSH_HOST || secrets.HOST || secrets.SERVER_IP }}
          QA_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          QA_KNOWN_HOSTS: ${{ secrets.QA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          test -n "$QA_HOST" && test -n "$QA_KEY" && test -n "$QA_KNOWN_HOSTS"
          printf '%s\n' "$QA_KEY" > "$RUNNER_TEMP/qa-key"
          chmod 600 "$RUNNER_TEMP/qa-key"
          printf '%s\n' "$QA_KNOWN_HOSTS" > "$RUNNER_TEMP/qa-known-hosts"
          chmod 600 "$RUNNER_TEMP/qa-known-hosts"
          ssh -i "$RUNNER_TEMP/qa-key" -o "UserKnownHostsFile=$RUNNER_TEMP/qa-known-hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$QA_HOST" "bash -s -- $(printf '%q' "$QA_MODE")" <<'REMOTE'
          set -euo pipefail
          set +x
          mode="$1"
          if [ "$mode" = provision ]; then
            cd /home/ubuntu/antigravity-trading-tool
            set -a
            source "$HOME/.secrets/trading.env"
            set +a
            PYTHONPATH=backend/trading-tool-backend python3 ops/qa/provision_finn_qa_fixture.py
            exit
          fi
          if [ "$mode" = diagnose-manifest ]; then
            set -a
            source "$HOME/.secrets/trading.env"
            set +a
            python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.home() / '.secrets/finn-qa-manifests'
          parent = root.parent
          key = Path.home() / '.secrets/finn-qa-manifest.key'
          print('manifest_root_exists=' + str(root.exists()).lower())
          print('manifest_root_is_directory=' + str(root.is_dir()).lower())
          print('manifest_root_writable=' + str(os.access(root, os.W_OK)).lower())
          print('manifest_parent_exists=' + str(parent.exists()).lower())
          print('manifest_parent_writable=' + str(os.access(parent, os.W_OK)).lower())
          print('manifest_key_exists=' + str(key.is_file()).lower())
          PY
            exit
          fi
          test "$mode" = diagnose
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.secrets'
          primary = root / 'trading.env'
          candidates = sorted(p for p in root.glob('trading.env*') if p.is_file())
          print('secret_file_present=' + str(primary.is_file()).lower())
          print('historical_secret_files_present=' + str(any(p != primary for p in candidates)).lower())
          for label, path in [('active', primary)]:
              if not path.is_file():
                  print(f'{label}_qa_binding=missing_file')
                  continue
              lines = path.read_text().splitlines()
              assignments = [line for line in lines if re.match(r'^\s*(?:export\s+)?FINN_QA_USER_ID\s*=', line)]
              if not assignments:
                  print(f'{label}_qa_binding=missing')
              elif len(assignments) != 1:
                  print(f'{label}_qa_binding=ambiguous')
              else:
                  raw = assignments[0].split('=', 1)[1].strip().strip('"\'')
                  print(f'{label}_qa_binding=' + ('numeric' if raw.isdecimal() and int(raw) > 0 else 'invalid'))
              build_assignments = [line for line in lines if re.match(r'^\s*(?:export\s+)?FINN_BUILD_SMOKE_USER_ID\s*=', line)]
              build_raw = build_assignments[0].split('=', 1)[1].strip().strip('"\'') if len(build_assignments) == 1 else ''
              print('active_build_binding=' + ('numeric' if build_raw.isdecimal() and int(build_raw) > 0 else 'missing_or_invalid'))
          historical = []
          for path in candidates:
              if path == primary:
                  continue
              for line in path.read_text().splitlines():
                  if re.match(r'^\s*(?:export\s+)?FINN_QA_USER_ID\s*=', line):
                      raw = line.split('=', 1)[1].strip().strip('"\'')
                      if raw.isdecimal() and int(raw) > 0:
                          historical.append(raw)
          print('historical_qa_binding_count=' + str(len(set(historical))))
          PY
          REMOTE
