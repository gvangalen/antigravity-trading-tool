name: FINN QA Fixture Operations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose or provision the designated protected QA fixture
        required: true
        type: choice
        options:
          - diagnose
          - diagnose-manifest
          - diagnose-coach-runs
          - provision

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'gvangalen/antigravity-trading-tool'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare protected connection
        shell: bash
        env:
          QA_MODE: ${{ inputs.mode }}
          QA_HOST: ${{ secrets.QA_SSH_HOST || secrets.HOST || secrets.SERVER_IP }}
          QA_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          QA_KNOWN_HOSTS: ${{ secrets.QA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          test -n "$QA_HOST" && test -n "$QA_KEY" && test -n "$QA_KNOWN_HOSTS"
          printf '%s\n' "$QA_KEY" > "$RUNNER_TEMP/qa-key"
          chmod 600 "$RUNNER_TEMP/qa-key"
          printf '%s\n' "$QA_KNOWN_HOSTS" > "$RUNNER_TEMP/qa-known-hosts"
          chmod 600 "$RUNNER_TEMP/qa-known-hosts"
          ssh -i "$RUNNER_TEMP/qa-key" -o "UserKnownHostsFile=$RUNNER_TEMP/qa-known-hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$QA_HOST" "bash -s -- $(printf '%q' "$QA_MODE")" <<'REMOTE'
          set -euo pipefail
          set +x
          mode="$1"
          if [ "$mode" = diagnose-coach-runs ]; then
            cd /home/ubuntu/antigravity-trading-tool
            set -a
            source "$HOME/.secrets/trading.env"
            set +a
            PYTHONPATH=backend/trading-tool-backend python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          import json
          import hashlib
          import subprocess
          from sqlalchemy import text
          from backend.infrastructure.database import sync_engine
          from backend.services.finn_v2_request_preprocessor_service import FinnV2RequestPreprocessorService

          print('minimal_read_answers=' + ('enabled' if os.getenv('FINN_MINIMAL_READ_ANSWERS') == '1' else 'disabled_or_unset'))
          pm2_bin = os.path.join(os.path.expanduser('~'), '.nvm/versions/node/v20.19.5/bin/pm2')
          processes = subprocess.run(
              [pm2_bin, 'jlist'], capture_output=True, text=True, check=True,
              env={**os.environ, 'PATH': os.path.dirname(pm2_bin) + ':' + os.environ.get('PATH', '')},
          )
          for process in json.loads(processes.stdout):
              name = str(process.get('name') or '')
              if 'backend' in name or 'finn' in name:
                  env = (process.get('pm2_env') or {}).get('env') or {}
                  print('runtime=' + name + ' minimal_read_answers=' +
                        ('enabled' if env.get('FINN_MINIMAL_READ_ANSWERS') == '1' else 'disabled_or_unset'))
          start = datetime(2026, 10, 19, 4, 45, tzinfo=timezone.utc)
          end = datetime(2026, 10, 19, 4, 51, tzinfo=timezone.utc)
          with sync_engine.connect() as connection:
              rows = connection.execute(text("""
                  SELECT r.id, r.user_id, r.message, r.created_at, r.completed_at, r.status, r.error_code,
                         c.state_json->'responses_exchange'->>'answer_kind' AS answer_kind,
                         c.state_json->>'terminal_response_type' AS response_type,
                         c.state_json AS state_json
                  FROM finn_v2_runs r
                  LEFT JOIN finn_v2_runtime_contracts c ON c.run_id = r.id
                  WHERE r.created_at >= :start AND r.created_at < :end
                    AND r.status IN ('failed', 'unavailable', 'downgraded')
                  ORDER BY r.created_at
                  LIMIT 20
              """), {"start": start, "end": end}).mappings().all()
          print('coach_failure_count=' + str(len(rows)))
          print('distinct_owner_count=' + str(len({row['user_id'] for row in rows})))
          for row in rows:
              print(' '.join(f'{key}={row[key]}' for key in (
                  'id', 'created_at', 'completed_at', 'status', 'error_code',
                  'answer_kind', 'response_type',
              )))
              exchange = (row['state_json'] or {}).get('responses_exchange') or {}
              print('tool_names=' + ','.join(str(call.get('name') or '') for call in exchange.get('tool_trace') or []))
              print('response_shape=' + ' '.join((
                  'text_present=' + str(bool(str(exchange.get('answer') or '').strip())).lower(),
                  'answer_chars=' + str(len(str(exchange.get('answer') or ''))),
                  'response_id_present=' + str(bool(exchange.get('response_id'))).lower(),
                  'uses_previous_response=' + str(bool(exchange.get('uses_previous_response'))).lower(),
                  'unsupported_execution_copy=' + str(
                      exchange.get('answer') == 'Ik kan hier geen aankoop uitvoeren. We kunnen eerst je plan en risico bespreken; ondersteunde acties vragen een apart voorstel en bevestiging.'
                  ).lower(),
                  'answer_sha256=' + hashlib.sha256(str(exchange.get('answer') or '').encode()).hexdigest()[:12],
              )))
              message = str(row['message'] or '')
              facts = FinnV2RequestPreprocessorService().preprocess(message=message)
              print('request_shape=' + ' '.join((
                  'polarity=' + facts.action_polarity,
                  'fomo=' + str('fomo' in message.casefold()).lower(),
                  'dca_day=' + str('welke dag' in message.casefold() and 'dca' in message.casefold()).lower(),
                  'message_sha256=' + hashlib.sha256(message.encode()).hexdigest()[:12],
              )))
          with sync_engine.connect() as connection:
              completed = connection.execute(text("""
                  SELECT r.response_json->'reasoning_provenance'->>'answer_boundary' AS boundary,
                         c.state_json->'responses_exchange'->>'answer_kind' AS answer_kind
                  FROM finn_v2_runs r
                  LEFT JOIN finn_v2_runtime_contracts c ON c.run_id = r.id
                  WHERE r.created_at >= :start AND r.created_at < :end
                    AND r.status = 'completed'
                  ORDER BY r.created_at LIMIT 20
              """), {"start": start, "end": end}).mappings().all()
          print('completed_run_boundaries=' + ','.join(
              str(row['answer_kind'] or 'none') + ':' + str(row['boundary'] or 'none')
              for row in completed
          ))
          PY
            exit
          fi
          if [ "$mode" = provision ]; then
            cd /home/ubuntu/antigravity-trading-tool
            set -a
            source "$HOME/.secrets/trading.env"
            set +a
            PYTHONPATH=backend/trading-tool-backend python3 ops/qa/provision_finn_qa_fixture.py
            exit
          fi
          if [ "$mode" = diagnose-manifest ]; then
            set -a
            source "$HOME/.secrets/trading.env"
            set +a
            python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.home() / '.secrets/finn-qa-manifests'
          parent = root.parent
          key = Path.home() / '.secrets/finn-qa-manifest.key'
          print('manifest_root_exists=' + str(root.exists()).lower())
          print('manifest_root_is_directory=' + str(root.is_dir()).lower())
          print('manifest_root_writable=' + str(os.access(root, os.W_OK)).lower())
          print('manifest_parent_exists=' + str(parent.exists()).lower())
          print('manifest_parent_writable=' + str(os.access(parent, os.W_OK)).lower())
          print('manifest_key_exists=' + str(key.is_file()).lower())
          PY
            exit
          fi
          test "$mode" = diagnose
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.secrets'
          primary = root / 'trading.env'
          candidates = sorted(p for p in root.glob('trading.env*') if p.is_file())
          print('secret_file_present=' + str(primary.is_file()).lower())
          print('historical_secret_files_present=' + str(any(p != primary for p in candidates)).lower())
          for label, path in [('active', primary)]:
              if not path.is_file():
                  print(f'{label}_qa_binding=missing_file')
                  continue
              lines = path.read_text().splitlines()
              assignments = [line for line in lines if re.match(r'^\s*(?:export\s+)?FINN_QA_USER_ID\s*=', line)]
              if not assignments:
                  print(f'{label}_qa_binding=missing')
              elif len(assignments) != 1:
                  print(f'{label}_qa_binding=ambiguous')
              else:
                  raw = assignments[0].split('=', 1)[1].strip().strip('"\'')
                  print(f'{label}_qa_binding=' + ('numeric' if raw.isdecimal() and int(raw) > 0 else 'invalid'))
              build_assignments = [line for line in lines if re.match(r'^\s*(?:export\s+)?FINN_BUILD_SMOKE_USER_ID\s*=', line)]
              build_raw = build_assignments[0].split('=', 1)[1].strip().strip('"\'') if len(build_assignments) == 1 else ''
              print('active_build_binding=' + ('numeric' if build_raw.isdecimal() and int(build_raw) > 0 else 'missing_or_invalid'))
          historical = []
          for path in candidates:
              if path == primary:
                  continue
              for line in path.read_text().splitlines():
                  if re.match(r'^\s*(?:export\s+)?FINN_QA_USER_ID\s*=', line):
                      raw = line.split('=', 1)[1].strip().strip('"\'')
                      if raw.isdecimal() and int(raw) > 0:
                          historical.append(raw)
          print('historical_qa_binding_count=' + str(len(set(historical))))
          PY
          REMOTE
