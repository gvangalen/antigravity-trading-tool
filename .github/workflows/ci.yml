name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/trading-tool-backend/backend/requirements.txt pytest

      - name: Run backend canonical test suite
        env:
          JWT_SECRET_KEY: test-jwt-secret-key-for-platform-security-tests-123
          ENCRYPTION_KEY: sT0oqYH7C78mMKBYz4MWVR84zDl6QwVn-fC3jNpt7NE=
        run: pytest -q

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/trading-tool-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/trading-tool-frontend
        run: npm ci

      - name: Verify tracked frontend export inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "ℹ️ No parent commit available for export diff check; skipping tracked frontend export input check."
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          frontend_source_changed="$(printf '%s\n' "$changed_files" | grep '^frontend/trading-tool-frontend/' | grep -v '^frontend/trading-tool-frontend/out/' || true)"
          frontend_export_changed="$(printf '%s\n' "$changed_files" | grep '^frontend/trading-tool-frontend/out/' || true)"

          if [ -n "$frontend_source_changed" ] && [ -z "$frontend_export_changed" ]; then
            echo "Frontend source changed, but the tracked frontend export was not updated:" >&2
            printf '%s\n' "$frontend_source_changed" >&2
            echo "Run npm run build in frontend/trading-tool-frontend and commit out/ before pushing." >&2
            exit 1
          fi

      - name: Run frontend typecheck
        working-directory: frontend/trading-tool-frontend
        run: npm run typecheck

      - name: Run frontend focused tests
        working-directory: frontend/trading-tool-frontend
        run: |
          npm run lint:i18n
          npm run test:i18n
          npm run test:commands

      - name: Run frontend build
        working-directory: frontend/trading-tool-frontend
        run: npm run build

      - name: Verify tracked frontend export output
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- frontend/trading-tool-frontend/out; then
            echo "Frontend build produced uncommitted changes in frontend/trading-tool-frontend/out." >&2
            echo "Run npm run build in frontend/trading-tool-frontend and commit the updated export before pushing." >&2
            git diff --stat -- frontend/trading-tool-frontend/out >&2 || true
            exit 1
          fi

  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile quality gates
        working-directory: mobile
        run: |
          npm run typecheck
          npm run lint
          npm run smoke:web
          npm run smoke:ios
          npm run smoke:android

  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install backend security test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/trading-tool-backend/backend/requirements.txt pytest

      - name: Run backend security regression slice
        env:
          JWT_SECRET_KEY: test-jwt-secret-key-for-platform-security-tests-123
          ENCRYPTION_KEY: sT0oqYH7C78mMKBYz4MWVR84zDl6QwVn-fC3jNpt7NE=
        run: |
          pytest -q \
            backend/trading-tool-backend/backend/tests/test_security_phase8.py \
            backend/trading-tool-backend/backend/tests/test_security_phase9.py \
            backend/trading-tool-backend/backend/tests/test_security_phase10.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/trading-tool-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/trading-tool-frontend
        run: npm ci

      - name: Run frontend dependency audit
        working-directory: frontend/trading-tool-frontend
        run: npm run audit:high

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - frontend-quality
      - mobile-quality
      - security-baseline
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_ref: ${{ github.sha }}
    secrets: inherit
