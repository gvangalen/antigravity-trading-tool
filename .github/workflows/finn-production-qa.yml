name: FINN Production QA

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full, already-live release SHA to validate
        required: true
        type: string
      qa_profile:
        description: QA scope selected by the user-approved QA goal
        required: true
        default: auth_preflight
        type: choice
        options:
          - auth_preflight
          - manifest_key
          - targeted_regression
          - runtime_acceptance
          - action_contract_acceptance
          - full_release_acceptance
          - safety
          - latency
      manifest_id:
        description: Approved, non-secret manifest identifier; use none for auth_preflight
        required: true
        default: none
        type: string
      run_label:
        description: Traceable label without user or fixture data
        required: true
        type: string
      manifest_bundle:
        description: Encrypted QA-owned manifest bundle; leave empty to use an already staged manifest
        required: false
        default: ''
        type: string
      allow_fixture_actions:
        description: Permit QA-fixture proposals and confirmations for this protected run
        required: true
        default: false
        type: boolean
      allow_safe_fixture_execution:
        description: Permit allowlisted non-financial QA-fixture execution for this protected run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: finn-production-qa-${{ inputs.release_sha }}-${{ inputs.qa_profile }}
  cancel-in-progress: false

jobs:
  production-qa:
    if: github.repository == 'gvangalen/antigravity-trading-tool'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout requested trusted release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout QA control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: .qa-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release and profile inputs
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          QA_PROFILE: ${{ inputs.qa_profile }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          RUN_LABEL: ${{ inputs.run_label }}
          MANIFEST_BUNDLE: ${{ inputs.manifest_bundle }}
          ALLOW_FIXTURE_ACTIONS: ${{ inputs.allow_fixture_actions }}
          ALLOW_SAFE_FIXTURE_EXECUTION: ${{ inputs.allow_safe_fixture_execution }}
        run: |
          set -uo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QA_PROFILE" =~ ^(auth_preflight|manifest_key|targeted_regression|runtime_acceptance|action_contract_acceptance|full_release_acceptance|safety|latency)$ ]]
          [[ "$MANIFEST_ID" =~ ^[a-z0-9][a-z0-9._-]{0,80}$ ]]
          [[ "$RUN_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$ ]]
          [ "${#MANIFEST_BUNDLE}" -le 65535 ]
          [[ "$ALLOW_FIXTURE_ACTIONS" =~ ^(true|false)$ ]]
          [[ "$ALLOW_SAFE_FIXTURE_EXECUTION" =~ ^(true|false)$ ]]
          if [ "$ALLOW_SAFE_FIXTURE_EXECUTION" = "true" ] && [ "$ALLOW_FIXTURE_ACTIONS" != "true" ]; then
            echo "Safe fixture execution requires fixture-action authorization." >&2
            exit 1
          fi
          if [[ "$QA_PROFILE" =~ ^(auth_preflight|manifest_key)$ ]] && { [ "$ALLOW_FIXTURE_ACTIONS" = "true" ] || [ "$ALLOW_SAFE_FIXTURE_EXECUTION" = "true" ]; }; then
            echo "Fixture actions are invalid for a non-case QA profile." >&2
            exit 1
          fi
          git fetch origin main --quiet
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Resolve protected QA connection
        id: connection
        shell: bash
        env:
          QA_HOST: ${{ secrets.QA_SSH_HOST || secrets.HOST || secrets.SERVER_IP }}
          QA_KEY: ${{ secrets.QA_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
          QA_KNOWN_HOSTS: ${{ secrets.QA_SSH_KNOWN_HOSTS }}
          QA_REMOTE_DIR: ${{ vars.QA_REMOTE_DIR || '/home/ubuntu/antigravity-trading-tool' }}
        run: |
          set -euo pipefail
          if [ -z "${QA_HOST:-}" ] || [ -z "${QA_KEY:-}" ] || [ -z "${QA_KNOWN_HOSTS:-}" ]; then
            echo "Protected QA connection is not configured." >&2
            exit 1
          fi
          printf '%s\n' "$QA_KEY" > "$RUNNER_TEMP/finn-production-qa-key"
          chmod 600 "$RUNNER_TEMP/finn-production-qa-key"
          printf '%s\n' "$QA_KNOWN_HOSTS" > "$RUNNER_TEMP/finn-production-qa-known-hosts"
          chmod 600 "$RUNNER_TEMP/finn-production-qa-known-hosts"
          printf 'host=%s\n' "$QA_HOST" >> "$GITHUB_OUTPUT"
          printf 'remote_dir=%s\n' "$QA_REMOTE_DIR" >> "$GITHUB_OUTPUT"

      - name: Create isolated fixture namespace
        id: fixture_namespace
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          suffix="$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          printf 'value=qa-%s-%s-%s\n' "$GITHUB_RUN_ID" "${RELEASE_SHA:0:8}" "$suffix" >> "$GITHUB_OUTPUT"

      - name: Run protected production QA profile
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          QA_PROFILE: ${{ inputs.qa_profile }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          RUN_LABEL: ${{ inputs.run_label }}
          MANIFEST_BUNDLE: ${{ inputs.manifest_bundle }}
          ALLOW_FIXTURE_ACTIONS: ${{ inputs.allow_fixture_actions }}
          ALLOW_SAFE_FIXTURE_EXECUTION: ${{ inputs.allow_safe_fixture_execution }}
          QA_HOST: ${{ steps.connection.outputs.host }}
          QA_REMOTE_DIR: ${{ steps.connection.outputs.remote_dir }}
          FINN_QA_FIXTURE_NAMESPACE: ${{ steps.fixture_namespace.outputs.value }}
          QA_RUNNER_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +x
          report_name="finn-production-qa-${GITHUB_RUN_ID}.json"
          remote_state_dir="/tmp/finn-production-qa-${GITHUB_RUN_ID}"
          remote_report="${remote_state_dir}/${report_name}"
          remote_bundle="${remote_state_dir}/manifest.bundle"
          control_plane_runner=".qa-control-plane/backend/trading-tool-backend/backend/scripts/run_finn_production_qa.py"
          remote_runner="${remote_state_dir}/runner.py"
          runner_sha256="$(sha256sum "$control_plane_runner" | awk '{print $1}')"
          ssh_opts=(
            -i "$RUNNER_TEMP/finn-production-qa-key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/finn-production-qa-known-hosts"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          # shellcheck disable=SC2029 # The command intentionally expands the scoped remote path locally.
          ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "mkdir -p '$remote_state_dir' && chmod 700 '$remote_state_dir'"
          scp -i "$RUNNER_TEMP/finn-production-qa-key" -o UserKnownHostsFile="$RUNNER_TEMP/finn-production-qa-known-hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes "$control_plane_runner" "ubuntu@${QA_HOST}:${remote_runner}"
          if [ -n "${MANIFEST_BUNDLE:-}" ]; then
            printf '%s' "$MANIFEST_BUNDLE" > "$RUNNER_TEMP/finn-production-qa-manifest.bundle"
            chmod 600 "$RUNNER_TEMP/finn-production-qa-manifest.bundle"
            scp -i "$RUNNER_TEMP/finn-production-qa-key" -o UserKnownHostsFile="$RUNNER_TEMP/finn-production-qa-known-hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/finn-production-qa-manifest.bundle" "ubuntu@${QA_HOST}:${remote_bundle}"
          else
            remote_bundle=""
          fi
          remote_command=$(printf 'bash -s -- %q %q %q %q %q %q %q %q %q %q %q %q %q %q %q' "$RELEASE_SHA" "$QA_PROFILE" "$MANIFEST_ID" "$RUN_LABEL" "$QA_REMOTE_DIR" "$remote_report" "$GITHUB_RUN_ID" "$remote_bundle" "$ALLOW_FIXTURE_ACTIONS" "$ALLOW_SAFE_FIXTURE_EXECUTION" "$FINN_QA_FIXTURE_NAMESPACE" "$remote_runner" "$runner_sha256" "$QA_RUNNER_REVISION" "$remote_state_dir")
          # shellcheck disable=SC2029 # The SSH arguments are intentionally constructed by this protected runner.
          ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "$remote_command" <<'REMOTE'
          set -euo pipefail
          set +x
          release_sha="$1"
          qa_profile="$2"
          manifest_id="$3"
          run_label="$4"
          remote_dir="$5"
          report_path="$6"
          workflow_run_id="$7"
          manifest_bundle_path="$8"
          allow_fixture_actions="$9"
          allow_safe_fixture_execution="${10}"
          fixture_namespace="${11}"
          runner_path="${12}"
          runner_sha256="${13}"
          runner_revision="${14}"
          state_dir="${15}"
          cd "$remote_dir"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$(sha256sum "$runner_path" | awk '{print $1}')" = "$runner_sha256"
          test ! -f "$state_dir/runner.pid" || ! kill -0 "$(cat "$state_dir/runner.pid")" 2>/dev/null || exit 0
          set -a
          source "$HOME/.secrets/trading.env"
          set +a
          # These are scoped to this QA subprocess, never the application processes.
          export FINN_QA_ALLOW_FIXTURE_ACTIONS=0
          export FINN_QA_ALLOW_FIXTURE_EXECUTION=0
          if [ "$allow_fixture_actions" = "true" ]; then
            export FINN_QA_ALLOW_FIXTURE_ACTIONS=1
          fi
          if [ "$allow_safe_fixture_execution" = "true" ]; then
            export FINN_QA_ALLOW_FIXTURE_EXECUTION=1
          fi
          runner_args=(
              --release-sha "$release_sha" \
              --profile "$qa_profile" \
              --manifest-id "$manifest_id" \
              --run-label "$run_label" \
              --checkout "$remote_dir" \
              --release-marker "$remote_dir/ops/deploy/production/LAST_GOOD_COMMIT" \
              --manifest-root "${FINN_QA_MANIFEST_ROOT:-$HOME/ops/finn-qa-manifests}" \
              --workflow-run-id "$workflow_run_id" \
              --fixture-namespace "$fixture_namespace" \
              --runner-revision "$runner_revision" \
              --report-path "$report_path"
          )
          if [ -n "$manifest_bundle_path" ]; then
            runner_args+=(--manifest-bundle-path "$manifest_bundle_path")
          fi
          cat > "$state_dir/run.sh" <<RUNNER
          #!/usr/bin/env bash
          set -uo pipefail
          set +x
          cd $(printf '%q' "$remote_dir")
          set -a
          source "\$HOME/.secrets/trading.env"
          set +a
          export FINN_QA_ALLOW_FIXTURE_ACTIONS=$(printf '%q' "$FINN_QA_ALLOW_FIXTURE_ACTIONS")
          export FINN_QA_ALLOW_FIXTURE_EXECUTION=$(printf '%q' "$FINN_QA_ALLOW_FIXTURE_EXECUTION")
          # Preserve both a partial checkpoint and an exit code.  `set -e`
          # would otherwise skip runner.exit after a crash and make a later
          # SSH reconnect mistake a valid partial matrix for a fresh run.
          set +e
          PYTHONPATH=backend/trading-tool-backend python3 $(printf '%q' "$runner_path") $(printf '%q ' "${runner_args[@]}") --matrix-deadline-seconds 4800 --resume >"$state_dir/runner.log" 2>&1
          runner_status="\$?"
          set -e
          printf '%s\\n' "\$runner_status" > "$state_dir/runner.exit"
          exit "\$runner_status"
          RUNNER
          chmod 700 "$state_dir/run.sh"
          nohup "$state_dir/run.sh" </dev/null >/dev/null 2>&1 &
          printf '%s\\n' "$!" > "$state_dir/runner.pid"
          REMOTE
          # The runner is detached from the SSH session. A transport failure
          # while this workflow polls cannot cancel its protected server job.
          completed=0
          restarted=0
          for _ in $(seq 1 500); do
            # shellcheck disable=SC2029 # The remote state check deliberately receives local workflow paths.
            state="$(ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "if test -f '$remote_state_dir/runner.exit'; then echo complete; elif test -s '$remote_state_dir/runner.pid' && kill -0 \$(cat '$remote_state_dir/runner.pid') 2>/dev/null; then echo running; else echo interrupted; fi" 2>/dev/null || echo reconnecting)"
            case "$state" in
              complete)
                # A detached runner can exit cleanly after publishing an
                # honest partial checkpoint.  Resume that same matrix once;
                # ``--resume`` consumes only its explicit not_run rows.
                # shellcheck disable=SC2029 # The report path is an explicit remote argument, not a secret expansion.
                incomplete="$(ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "python3 -c 'import json,sys; print(\"true\" if json.load(open(sys.argv[1], encoding=\"utf-8\")).get(\"incomplete\") else \"false\")' '$remote_report'" 2>/dev/null || echo true)"
                if [ "$incomplete" = "true" ] && [ "$restarted" -eq 0 ]; then
                  restarted=1
                  # shellcheck disable=SC2029 # Restart is intentionally scoped to this workflow's remote state directory.
                  ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "rm -f '$remote_state_dir/runner.exit'; nohup '$remote_state_dir/run.sh' </dev/null >/dev/null 2>&1 & echo \$! > '$remote_state_dir/runner.pid'" || true
                else
                  completed=1
                  break
                fi
                ;;
              interrupted)
                if [ "$restarted" -eq 1 ]; then break; fi
                restarted=1
                # shellcheck disable=SC2029 # Resume is intentionally scoped to this workflow's remote state directory.
                ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "nohup '$remote_state_dir/run.sh' </dev/null >/dev/null 2>&1 & echo \$! > '$remote_state_dir/runner.pid'" || true
                ;;
            esac
            sleep 10
          done
          mkdir -p qa-artifacts
          if ! scp -i "$RUNNER_TEMP/finn-production-qa-key" -o UserKnownHostsFile="$RUNNER_TEMP/finn-production-qa-known-hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@${QA_HOST}:${remote_report}" "qa-artifacts/${report_name}"; then
            printf '{"schema_version":1,"outcome":"failed","error_category":"ssh","profile":"%s"}\n' "$QA_PROFILE" > "qa-artifacts/${report_name}"
          fi
          sha256sum "qa-artifacts/${report_name}" > "qa-artifacts/${report_name}.sha256"
          # Artifact collection precedes the runner exit check so a crash is
          # visible to QA instead of being mistaken for an empty matrix.
          # shellcheck disable=SC2029 # The runner exit file belongs to this remote workflow state only.
          runner_exit="$(ssh "${ssh_opts[@]}" "ubuntu@${QA_HOST}" "cat '$remote_state_dir/runner.exit'" 2>/dev/null || true)"
          test "$completed" -eq 1
          test "$runner_exit" -eq 0

      - name: Upload sanitized QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finn-production-qa-${{ github.run_id }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
